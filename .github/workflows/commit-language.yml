name: 中文提交检查

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:

permissions:
  contents: read

jobs:
  commit-language:
    name: 提交标题使用中文
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: 检查新增提交
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          if not base or set(base) == {'0'}:
              # 新分支只检查不在其他远程分支上的提交，避免追溯检查历史。
              others = subprocess.check_output(['git', 'for-each-ref', '--format=%(objectname)', 'refs/remotes/origin/'], text=True).splitlines()
              others = [sha for sha in others if sha != head]
              revisions = [head, '--not', *others] if others else ['-1', head]
          else:
              revisions = [f'{base}..{head}']
          commits = subprocess.check_output(['git', 'log', '--format=%h %s', *revisions], text=True).splitlines()
          invalid = [line for line in commits if not re.search(r'[\u4e00-\u9fff]', line.partition(' ')[2])]
          if invalid:
              print('以下提交标题必须改为中文：\n' + '\n'.join(invalid))
              raise SystemExit(1)
          print(f'已检查 {len(commits)} 个新增提交。')
          PY
