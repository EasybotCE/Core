name: Build and Test

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dev/go.mod
          cache-dependency-path: dev/go.sum
      - name: Test
        working-directory: dev
        run: go test ./...
      - name: Vet
        working-directory: dev
        run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/web/package-lock.json
      - name: 构建便携包
        run: node build.mjs
      - name: 上传便携包
        uses: actions/upload-artifact@v4
        with:
          name: easybotce-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/web/package-lock.json
      - name: Install dependencies
        working-directory: dev/web
        run: npm ci
      - name: Build
        working-directory: dev/web
        run: npm run build
